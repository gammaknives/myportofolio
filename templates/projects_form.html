{% extends 'base.html' %}

{% block title %}{{ name }} - Add Project{% endblock title %}

{% block content %}
<main>
    <section class="projects" id="add-project">
        <div class="container">
            <h2>Add New Project</h2>

            <form method="post" action="{% url 'main:create_project' %}" class="project-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="project-cta">Tambah Project</button>
                <a href="{% url 'main:show_project' %}" class="project-search-clear">Batal</a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
