<a href="{% url 'main:update_project' project.id %}" class="project-cta project-edit-link">
    Edit Project
</a>

<button type="button"
        class="project-cta project-delete-trigger"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Hapus {{ project.title }}"
        title="Hapus proyek">
    Delete Project
</button>

<div id="delete-project-{{ project.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-project-title-{{ project.id }}">Delete Project?</h2>
        <p>
            Are you sure you want to delete the project <strong>{{ project.title }}</strong>?
            <strong>{{ project.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="project-search-clear"
                    popovertarget="delete-project-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_project' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
