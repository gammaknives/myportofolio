<div class="project-actions-row">
    <a href="{% url 'main:update_experience' experience.id %}" class="project-edit-link">
        Edit
    </a>

    <button type="button"
            class="project-delete-trigger"
            popovertarget="delete-experience-{{ experience.id }}"
            aria-label="Delete {{ experience.title }}"
            title="Delete experience">
        Delete
    </button>
</div>

<div id="delete-experience-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Delete Experience?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="project-search-clear"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
